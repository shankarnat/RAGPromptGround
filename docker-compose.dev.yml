version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ragpromptground-steve-app-dev
    ports:
      - "5175:5175"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/ragplayground
      - PORT=5175
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ragplayground-network
    volumes:
      - ./client:/app/client
      - ./server:/app/server
      - ./shared:/app/shared
      - ./attached_assets:/app/attached_assets
      - /app/node_modules
    command: npm run dev

  db:
    image: postgres:16-alpine
    container_name: ragpromptground-steve-db-dev
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=ragplayground
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ragplayground-network

networks:
  ragplayground-network:
    name: ragpromptground-steve-network-dev
    driver: bridge

volumes:
  postgres_data_dev:
    name: ragpromptground-steve-postgres-data-dev